# Publica o repositório no GitHub Pages.
#
# `enablement: true` faz o próprio fluxo LIGAR as Pages na primeira execução,
# em vez de depender de alguém marcar a opção na tela de configurações. É o
# caminho confiável: a tela é pesada e nem sempre responde, e assim a
# publicação passa a fazer parte do repositório, não de uma memória de quem
# clicou onde.
#
# A obra é HTML estático — nada é compilado. O repositório inteiro é enviado
# como está, e é por isso que o `.nojekyll` existe: sem ele o GitHub tentaria
# processar tudo como um site Jekyll e ignoraria arquivos e pastas que
# começam com underscore.

name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Uma publicação por vez. `cancel-in-progress: false` porque cancelar uma
# publicação no meio deixa o site num estado indefinido — melhor esperar a
# anterior terminar.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deploy
        uses: actions/deploy-pages@v4
