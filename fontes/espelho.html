<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Espelho alinhado · Raízes Cósmicas</title>
<!--
  O ESPELHO ALINHADO -- 25/09. "Tem como fazer um alinhamento quando
  espelhar, uma compensacao, pois o espelhamento fica torto."

  O scrcpy le o painel cru do Quest: um olho, com a curvatura da lente, e
  so gira de 90 em 90 graus. Esta pagina CAPTURA a janela do espelho (a do
  scrcpy ou a da transmissao Meta, pelo getDisplayMedia do navegador) e a
  redesenha num shader: rotacao fina, zoom, deslocamento e a curvatura da
  lente desfeita (k1, k2). Os ajustes ficam guardados neste navegador; em
  tela cheia no projetor, o painel some.

  Teclas: [ ] giram 0,1 grau (com Shift, 1), setas deslocam, + - zoom,
  M espelha, F tela cheia, H esconde o painel, R zera, E estabiliza.

  O ESTABILIZADOR -- 26/09, "ainda esta oscilando a imagem do espelhamento".
  Medido no projetor: entre duas fotos com 0,15 s de intervalo a imagem inteira
  pulava 6 a 12 % da largura -- e a cabeca de quem esta de oculos, e o espelho
  mostra exatamente o que o oculos ve. Aqui, a cada quadro novo, o miolo da
  imagem (70 %) e reduzido a 128 x 64 cinzas e comparado ao anterior por
  CORRELACAO DE FASE (duas FFTs, o pico diz quanto tudo andou). O caminho medido
  e alisado (um filtro de "suavidade" segundos) e a imagem e deslocada pela
  diferenca: o que era tranco some, o que era olhar devagar para o lado fica. Um
  zoom de 15 % (margem) esconde as bordas que o deslocamento revelaria. So
  translacao: o giro da cabeca (inclinar) nao e compensado.

  MODO PROJETOR (?auto=1): ajustes guardados a parte, estabilizador ligado, sem
  painel; a Cabine abre esta pagina em quiosque e dispara capturar() pelo
  DevTools do Chrome (com gesto), e o Chrome escolhe sozinho a janela
  "Quest — espelho" (--auto-select-desktop-capture-source).
-->
<style>
  :root{ --fundo:#000; --painel:rgba(14,16,24,.92); --texto:#e8e9ee; --texto2:#9aa1b4; --acento:#e6b3ff; --linha:#2a3150; }
  html,body{ margin:0; height:100%; background:var(--fundo); color:var(--texto);
             font:14px/1.4 -apple-system,system-ui,"Segoe UI",sans-serif; overflow:hidden; }
  canvas{ position:fixed; inset:0; width:100%; height:100%; display:block; }
  #painel{ position:fixed; top:16px; left:16px; width:300px; max-width:calc(100vw - 32px);
           background:var(--painel); border:1px solid var(--linha); border-radius:14px; padding:14px; z-index:2; }
  #painel.fora{ display:none; }
  h1{ font-size:15px; margin:0 0 4px; font-weight:600; }
  .nota{ color:var(--texto2); font-size:12px; margin:0 0 10px; }
  label{ display:grid; grid-template-columns:92px 1fr 48px; gap:8px; align-items:center; margin:6px 0; font-size:12px; color:var(--texto2); }
  input[type=range]{ width:100%; accent-color:var(--acento); }
  output{ font-family:ui-monospace,Menlo,monospace; font-size:12px; text-align:right; color:var(--texto); }
  .botoes{ display:flex; flex-wrap:wrap; gap:6px; margin-top:10px; }
  button{ background:#1a1f33; color:var(--texto); border:1px solid var(--linha); border-radius:9px; padding:7px 10px; font:inherit; font-size:12px; cursor:pointer; }
  button:hover{ border-color:var(--acento); }
  button.primario{ background:var(--acento); color:#1a0f22; border-color:transparent; font-weight:600; }
  #grade{ position:fixed; inset:0; pointer-events:none; z-index:1; display:none;
          background:
            linear-gradient(to right, transparent calc(50% - .5px), rgba(230,179,255,.55) calc(50% - .5px), rgba(230,179,255,.55) calc(50% + .5px), transparent calc(50% + .5px)),
            linear-gradient(to bottom, transparent calc(50% - .5px), rgba(230,179,255,.55) calc(50% - .5px), rgba(230,179,255,.55) calc(50% + .5px), transparent calc(50% + .5px)),
            repeating-linear-gradient(to right, rgba(255,255,255,.12) 0 1px, transparent 1px 10%),
            repeating-linear-gradient(to bottom, rgba(255,255,255,.12) 0 1px, transparent 1px 10%); }
  #grade.sim{ display:block; }
  #vazio{ position:fixed; inset:0; display:flex; align-items:center; justify-content:center; color:var(--texto2); font-size:13px; text-align:center; padding:16px; z-index:2; }
  /* 8.8 (26/09): "coloca um QR code para nosso site sempre na lateral do espelhamento" --
     fica em todo estado, inclusive em tela cheia; e "quando acabar o espelhamento,
     coloque ja a animacao": sem captura ao vivo, a animacao da Odara toca em laco. */
  #qr{ position:fixed; right:22px; bottom:22px; z-index:4; width:120px; text-align:center; pointer-events:none; }
  /* 26/09: o QR agora e preto sobre branco, com a margem dentro do proprio svg (o invertido nao lia em muitos celulares) */
  #qr img{ width:132px; height:132px; display:block; background:#fff; padding:0; border-radius:8px; box-sizing:border-box; }
  #qr span{ display:block; margin-top:5px; font-size:12px; letter-spacing:.06em; color:#fff; text-shadow:0 1px 6px #000; }
  #anim{ position:fixed; inset:0; width:100%; height:100%; object-fit:cover; background:#000; z-index:1; display:none; }
  #anim.no{ display:block; }
</style>
</head>
<body>
<canvas id="tela"></canvas>
<div id="grade"></div>
<div id="vazio">Clique em <b>&nbsp;Capturar o espelho&nbsp;</b> e escolha a janela “Quest — espelho” (ou a aba da transmissão Meta).</div>
<div id="painel">
  <h1>Espelho alinhado</h1>
  <p class="nota">Endireite com a grade ligada: o horizonte da sala na linha do meio.</p>
  <label>girar (°)   <input type="range" id="ang"  min="-30"  max="30"  step="0.1"><output id="oAng"></output></label>
  <label>zoom        <input type="range" id="zoom" min="0.5"  max="3"   step="0.01"><output id="oZoom"></output></label>
  <label>para o lado <input type="range" id="dx"   min="-0.5" max="0.5" step="0.002"><output id="oDx"></output></label>
  <label>para cima   <input type="range" id="dy"   min="-0.5" max="0.5" step="0.002"><output id="oDy"></output></label>
  <label>lente k1    <input type="range" id="k1"   min="-0.8" max="0.8" step="0.01"><output id="oK1"></output></label>
  <label>lente k2    <input type="range" id="k2"   min="-0.5" max="0.5" step="0.01"><output id="oK2"></output></label>
  <label>suavidade   <input type="range" id="suave" min="0.2" max="2.5" step="0.05"><output id="oSuave"></output></label>
  <label>margem      <input type="range" id="margem" min="1.05" max="1.40" step="0.01"><output id="oMargem"></output></label>
  <div class="botoes">
    <button class="primario" id="bCap">Capturar o espelho</button>
    <button id="bGrade">Grade</button>
    <button id="bEsp">Espelhar (M)</button>
    <button id="bCheia">Tela cheia (F)</button>
    <button id="bZero">Zerar (R)</button>
    <button id="bEstab">Estabilizar (E)</button>
  </div>
  <p class="nota mono" id="estInfo" style="margin:8px 0 0">estabilizador desligado</p>
  <p class="nota" style="margin:10px 0 0">[ ] girar · setas deslocar · + − zoom · H esconde o painel</p>
</div>

<video id="fonte" autoplay muted playsinline style="display:none"></video>
<video id="anim" src="../assets/video/odara-cosmos.mp4" loop muted playsinline preload="auto"></video>
<div id="qr"><img src="qr-visoesfilmes.svg" alt="visoesfilmes.com"><span>visoesfilmes.com</span></div>

<script>
const $ = (id) => document.getElementById(id);
const PARAM = new URLSearchParams(location.search);
const AUTO = PARAM.get('auto') === '1';          // modo projetor: aberto pela Cabine
const CHAVE = AUTO ? 'raizes-espelho-projetor' : 'raizes-espelho-alinhado';
const PADRAO = { ang:0, zoom:1, dx:0, dy:0, k1:0, k2:0, espelhar:false, estab:AUTO, suave:0.9, margem:1.15 };
let A = Object.assign({}, PADRAO);
try{ Object.assign(A, JSON.parse(localStorage.getItem(CHAVE) || '{}')); }catch(e){}
const guardar = () => { try{ localStorage.setItem(CHAVE, JSON.stringify(A)); }catch(e){} };

const CAMPOS = { ang:[v=>v.toFixed(1)+'°'], zoom:[v=>v.toFixed(2)+'×'], dx:[v=>v.toFixed(3)], dy:[v=>v.toFixed(3)],
                 k1:[v=>v.toFixed(2)], k2:[v=>v.toFixed(2)], suave:[v=>v.toFixed(2)+' s'], margem:[v=>v.toFixed(2)+'×'] };
if (PARAM.get('estab') === '1') A.estab = true;
if (PARAM.get('espelhar') === '1') A.espelhar = true; else if (PARAM.get('espelhar') === '0') A.espelhar = false;
function mostrar(){
  for (const k in CAMPOS){ $(k).value = A[k]; $('o' + k[0].toUpperCase() + k.slice(1)).textContent = CAMPOS[k][0](+A[k]); }
  $('bEsp').textContent = A.espelhar ? 'Espelhado (M)' : 'Espelhar (M)';
  $('bEstab').textContent = A.estab ? 'Estabilizado (E)' : 'Estabilizar (E)';
}
for (const k in CAMPOS) $(k).addEventListener('input', e => { A[k] = +e.target.value; mostrar(); guardar(); });

/* ── o desenho ─────────────────────────────────────────────────────────── */
const cv = $('tela'), gl = cv.getContext('webgl', { antialias:false, preserveDrawingBuffer:false });
const VS = 'attribute vec2 p; varying vec2 uv; void main(){ uv = p*0.5+0.5; gl_Position = vec4(p,0.,1.); }';
/* Para cada pixel da saida: centro, proporcao da saida, desfaz o zoom e o
   giro, desfaz a curvatura da lente (p * (1 + k1 r2 + k2 r4)), desloca, e
   volta para as coordenadas da fonte na proporcao dela. Fora da fonte: preto. */
const FS = `precision highp float;
varying vec2 uv;
uniform sampler2D fonte;
uniform vec2 saida, entrada;
uniform float ang, zoom, k1, k2, espelhar;
uniform vec2 desl;
uniform vec2 corr;      // o estabilizador: quanto o quadro atual esta fora do caminho alisado (fracao do video)
uniform float margem;   // o zoom extra que esconde as bordas quando ha correcao
void main(){
  vec2 p = uv - 0.5;
  if(espelhar > 0.5) p.x = -p.x;
  p.x *= saida.x / saida.y;
  p /= zoom * margem;
  float c = cos(ang), s = sin(ang);
  p = vec2(c*p.x - s*p.y, s*p.x + c*p.y);
  float r2 = dot(p, p);
  p *= 1.0 + k1*r2 + k2*r2*r2;
  p -= vec2(desl.x, -desl.y);
  p.x /= entrada.x / entrada.y;
  vec2 q = p + 0.5;
  q.y = 1.0 - q.y;
  q += corr;
  if(q.x < 0.0 || q.x > 1.0 || q.y < 0.0 || q.y > 1.0){ gl_FragColor = vec4(0.,0.,0.,1.); return; }
  gl_FragColor = vec4(texture2D(fonte, q).rgb, 1.0);
}`;
function compilar(tipo, src){ const s = gl.createShader(tipo); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, compilar(gl.VERTEX_SHADER, VS)); gl.attachShader(prog, compilar(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog); gl.useProgram(prog);
const buf = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 1,-1, -1,1, 1,1]), gl.STATIC_DRAW);
const aP = gl.getAttribLocation(prog, 'p'); gl.enableVertexAttribArray(aP); gl.vertexAttribPointer(aP, 2, gl.FLOAT, false, 0, 0);
const U = {}; for (const n of ['fonte','saida','entrada','ang','zoom','k1','k2','espelhar','desl','corr','margem']) U[n] = gl.getUniformLocation(prog, n);
const tex = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, tex);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE); gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);

const video = $('fonte');
/* a animacao entra sempre que nao ha espelho ao vivo: antes da primeira captura e
   assim que a captura termina (a janela do scrcpy fechou, ou a transmissao parou) */
const anim = $('anim');
let aoVivo = false;
function mostrarAnimacao(sim){
  anim.classList.toggle('no', sim);
  if(sim){ anim.play().catch(()=>{}); } else { anim.pause(); }
}
mostrarAnimacao(true);
function quadro(){
  const dpr = Math.min(devicePixelRatio || 1, 2), w = Math.round(innerWidth * dpr), h = Math.round(innerHeight * dpr);
  if (cv.width !== w || cv.height !== h){ cv.width = w; cv.height = h; }
  gl.viewport(0, 0, w, h);
  if (aoVivo && video.readyState >= 2 && video.videoWidth){
    gl.bindTexture(gl.TEXTURE_2D, tex);
    gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGB, gl.RGB, gl.UNSIGNED_BYTE, video);
    gl.uniform1i(U.fonte, 0);
    gl.uniform2f(U.saida, w, h); gl.uniform2f(U.entrada, video.videoWidth, video.videoHeight);
    gl.uniform1f(U.ang, A.ang * Math.PI / 180); gl.uniform1f(U.zoom, A.zoom);
    gl.uniform1f(U.k1, A.k1); gl.uniform1f(U.k2, A.k2); gl.uniform1f(U.espelhar, A.espelhar ? 1 : 0);
    gl.uniform2f(U.desl, A.dx, A.dy);
    gl.uniform2f(U.corr, A.estab ? EST.corr[0] : 0, A.estab ? EST.corr[1] : 0);
    gl.uniform1f(U.margem, A.estab ? A.margem : 1);
    gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  } else { gl.clearColor(0,0,0,1); gl.clear(gl.COLOR_BUFFER_BIT); }
  requestAnimationFrame(quadro);
}
requestAnimationFrame(quadro);

/* ── o estabilizador (26/09) ───────────────────────────────────────────── */
const EST = { N:128, M:64, P:[0,0], S:[0,0], corr:[0,0], t0:0, conf:0, pulo:0, quadros:0,
              re:null, im:null, r0:null, i0:null, cr:null, ci:null, jan:null, ctx:null, tab:{} };
(function preparar(){
  const N = EST.N, M = EST.M, n = N * M;
  EST.re = new Float32Array(n); EST.im = new Float32Array(n); EST.r0 = null; EST.i0 = null;
  EST.cr = new Float32Array(n); EST.ci = new Float32Array(n); EST.jan = new Float32Array(n);
  for (let y = 0; y < M; y++) for (let x = 0; x < N; x++)
    EST.jan[y * N + x] = (0.5 - 0.5 * Math.cos(2 * Math.PI * x / (N - 1))) * (0.5 - 0.5 * Math.cos(2 * Math.PI * y / (M - 1)));
  const c = document.createElement('canvas'); c.width = N; c.height = M;
  EST.ctx = c.getContext('2d', { willReadFrequently:true });
})();
// FFT de raiz 2, no lugar, num vetor com passo (linhas: passo 1; colunas: passo N)
function fft(re, im, ini, passo, n, inv){
  for (let i = 1, j = 0; i < n; i++){
    let b = n >> 1; for (; j & b; b >>= 1) j ^= b; j ^= b;
    if (i < j){ const a = ini + i * passo, z = ini + j * passo;
      let t = re[a]; re[a] = re[z]; re[z] = t; t = im[a]; im[a] = im[z]; im[z] = t; }
  }
  for (let len = 2; len <= n; len <<= 1){
    const ang = (inv ? 2 : -2) * Math.PI / len, wr = Math.cos(ang), wi = Math.sin(ang);
    for (let i = 0; i < n; i += len){
      let cr = 1, ci = 0;
      for (let k = 0; k < len / 2; k++){
        const a = ini + (i + k) * passo, z = ini + (i + k + len / 2) * passo;
        const tr = re[z] * cr - im[z] * ci, ti = re[z] * ci + im[z] * cr;
        re[z] = re[a] - tr; im[z] = im[a] - ti; re[a] += tr; im[a] += ti;
        const ncr = cr * wr - ci * wi; ci = cr * wi + ci * wr; cr = ncr;
      }
    }
  }
}
function fft2(re, im, inv){
  const N = EST.N, M = EST.M;
  for (let y = 0; y < M; y++) fft(re, im, y * N, 1, N, inv);
  for (let x = 0; x < N; x++) fft(re, im, x, N, M, inv);
}
function analisar(){
  const v = video, vw = v.videoWidth, vh = v.videoHeight;
  if (!vw || !vh) return;
  const N = EST.N, M = EST.M, n = N * M, re = EST.re, im = EST.im;
  EST.ctx.drawImage(v, vw * 0.15, vh * 0.15, vw * 0.7, vh * 0.7, 0, 0, N, M);
  const d = EST.ctx.getImageData(0, 0, N, M).data;
  let media = 0;
  for (let k = 0; k < n; k++){ const g = 0.299 * d[k*4] + 0.587 * d[k*4+1] + 0.114 * d[k*4+2]; re[k] = g; media += g; }
  media /= n;
  for (let k = 0; k < n; k++){ re[k] = (re[k] - media) * EST.jan[k]; im[k] = 0; }
  fft2(re, im, false);
  const agora = performance.now() / 1000, dt = EST.t0 ? Math.min(0.2, agora - EST.t0) : 0.033;
  EST.t0 = agora;
  if (EST.r0){
    const cr = EST.cr, ci = EST.ci, r0 = EST.r0, i0 = EST.i0;
    for (let k = 0; k < n; k++){
      const a = re[k], b = im[k], c = r0[k], e = i0[k];
      const x = a * c + b * e, y = b * c - a * e, m = Math.hypot(x, y) + 1e-9;
      cr[k] = x / m; ci[k] = y / m;
    }
    fft2(cr, ci, true);
    let melhor = -1e9, px = 0, py = 0;
    for (let k = 0; k < n; k++) if (cr[k] > melhor){ melhor = cr[k]; px = k % N; py = (k / N) | 0; }
    const val = (x, y) => cr[((y + M) % M) * N + ((x + N) % N)];
    const sub = (l, c, r) => { const q = l - 2 * c + r; return Math.abs(q) > 1e-9 ? 0.5 * (l - r) / q : 0; };
    let dx = px + sub(val(px - 1, py), melhor, val(px + 1, py));
    let dy = py + sub(val(px, py - 1), melhor, val(px, py + 1));
    if (dx > N / 2) dx -= N; if (dy > M / 2) dy -= M;
    EST.conf = melhor / n;
    // so vale se o pico for claro e o pulo plausivel; senao, "nao andou" (o alisado alcanca sozinho)
    if (EST.conf > 0.06 && Math.abs(dx) < N / 3 && Math.abs(dy) < M / 3){
      EST.P[0] += dx / N * 0.7; EST.P[1] += dy / M * 0.7;
      EST.pulo = Math.hypot(dx / N * 0.7, dy / M * 0.7);
    }
  }
  if (!EST.r0){ EST.r0 = new Float32Array(n); EST.i0 = new Float32Array(n); }
  EST.r0.set(re); EST.i0.set(im);
  // o caminho alisado, e a correcao presa dentro da margem
  const k = 1 - Math.exp(-dt / Math.max(0.05, A.suave));
  const lim = (1 - 1 / A.margem) / 2 * 0.95;
  for (let a = 0; a < 2; a++){
    EST.S[a] += (EST.P[a] - EST.S[a]) * k;
    let c = EST.P[a] - EST.S[a];
    c = Math.max(-lim, Math.min(lim, c));
    EST.S[a] = EST.P[a] - c;          // o alisado nunca deixa a correcao sair da margem
    EST.corr[a] = c;
  }
  EST.quadros++;
}
function aCadaQuadroNovo(){
  if (A.estab && aoVivo) { try { analisar(); } catch (e) {} }
  if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(aCadaQuadroNovo);
  else setTimeout(aCadaQuadroNovo, 33);
}
setInterval(() => {
  $('estInfo').textContent = A.estab
    ? `estabilizando · pico ${EST.conf.toFixed(2)} · pulo ${(EST.pulo * 100).toFixed(1)} % · correção ${(Math.hypot(EST.corr[0], EST.corr[1]) * 100).toFixed(1)} %`
    : 'estabilizador desligado';
}, 500);

/* ── a captura ─────────────────────────────────────────────────────────── */
async function capturar(){
  try{
    const fluxo = await navigator.mediaDevices.getDisplayMedia({ video:{ frameRate:{ ideal:60 }, cursor:'never' }, audio:false });
    video.srcObject = fluxo; await video.play();
    $('vazio').style.display = 'none'; aoVivo = true; mostrarAnimacao(false);
    EST.r0 = null; EST.P = [0, 0]; EST.S = [0, 0]; EST.corr = [0, 0];
    if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(aCadaQuadroNovo); else aCadaQuadroNovo();
    fluxo.getVideoTracks()[0].addEventListener('ended', () => { aoVivo = false; mostrarAnimacao(true); $('vazio').style.display = 'flex'; });
  }catch(e){
    $('vazio').innerHTML = 'Captura recusada (' + e.name + '). No Mac: Ajustes do Sistema → Privacidade → Gravação de Tela → permitir o Chrome, e tentar de novo.';
  }
}
$('bCap').onclick = capturar;
window.capturar = capturar;          // a Cabine chama pelo DevTools (modo projetor)
$('bEstab').onclick = () => { A.estab = !A.estab; EST.corr = [0, 0]; mostrar(); guardar(); };
if (AUTO) $('painel').classList.add('fora');
$('bGrade').onclick = () => $('grade').classList.toggle('sim');
$('bEsp').onclick = () => { A.espelhar = !A.espelhar; mostrar(); guardar(); };
$('bCheia').onclick = () => (document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen()).catch(()=>{});
$('bZero').onclick = () => { A = Object.assign({}, PADRAO); mostrar(); guardar(); };
document.addEventListener('fullscreenchange', () => $('painel').classList.toggle('fora', !!document.fullscreenElement));

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT') return;
  const passo = e.shiftKey ? 10 : 1, k = e.key;
  if (k === '[') A.ang = +(A.ang - 0.1 * passo).toFixed(2);
  else if (k === ']') A.ang = +(A.ang + 0.1 * passo).toFixed(2);
  else if (k === 'ArrowLeft') A.dx -= 0.002 * passo; else if (k === 'ArrowRight') A.dx += 0.002 * passo;
  else if (k === 'ArrowUp') A.dy += 0.002 * passo; else if (k === 'ArrowDown') A.dy -= 0.002 * passo;
  else if (k === '+' || k === '=') A.zoom = Math.min(3, A.zoom + 0.01 * passo);
  else if (k === '-') A.zoom = Math.max(0.5, A.zoom - 0.01 * passo);
  else if (k === 'm' || k === 'M') A.espelhar = !A.espelhar;
  else if (k === 'f' || k === 'F') return $('bCheia').onclick();
  else if (k === 'h' || k === 'H') return $('painel').classList.toggle('fora');
  else if (k === 'g' || k === 'G') return $('bGrade').onclick();
  else if (k === 'r' || k === 'R') return $('bZero').onclick();
  else if (k === 'e' || k === 'E') return $('bEstab').onclick();
  else return;
  e.preventDefault(); mostrar(); guardar();
});
mostrar();
</script>
